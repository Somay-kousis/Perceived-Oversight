[project]
name = "perceived-oversight"
version = "0.1.0"
description = "Research code for the Perceived Oversight paper"
requires-python = ">=3.11"
dependencies = [
    "control-arena",
    "inspect-ai>=0.3.272",
    "pyyaml",
    "shade-arena @ git+https://github.com/rasmusfaber/SHADE-Arena.git@wheels",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/perceived_oversight"]
