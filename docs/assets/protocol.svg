<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" role="img" aria-label="The informant protocol: U sends a request with a memo; a live trusted monitor scores it; low scores execute through the broker, middle scores are held, high scores end the episode"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8f8c84"/></marker></defs><rect width="640" height="236" rx="12" fill="#070707"/><rect x="20" y="24" width="160" height="78" rx="8" fill="#0f0f0e" stroke="#2c2a27" stroke-width="1"/><text x="34" y="48" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F6F5F1">Agent U</text><text x="34" y="68" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">capability removed</text><text x="34" y="85" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">one tool: the broker</text><rect x="240" y="24" width="160" height="78" rx="8" fill="#0f0f0e" stroke="#2c2a27" stroke-width="1"/><text x="254" y="48" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F6F5F1">Live monitor</text><text x="254" y="68" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">scores each request</text><text x="254" y="85" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">two prompts, averaged</text><rect x="460" y="24" width="160" height="101" rx="8" fill="#0f0f0e" stroke="#FFB224" stroke-width="1"/><text x="474" y="48" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F6F5F1">Broker</text><text x="474" y="68" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">holds the capability</text><text x="474" y="85" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">same under every cover</text><text x="474" y="108" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#FFB224">reports to the defence</text><line x1="180" y1="56" x2="236" y2="56" stroke="#55524b" stroke-width="1" marker-end="url(#ah)"/><text x="208.0" y="49.0" text-anchor="middle" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8f8c84">request</text><line x1="400" y1="56" x2="456" y2="56" stroke="#55524b" stroke-width="1" marker-end="url(#ah)"/><text x="428.0" y="49.0" text-anchor="middle" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8f8c84">low</text><rect x="150" y="158" width="140" height="61" rx="8" fill="#0f0f0e" stroke="#2c2a27" stroke-width="1"/><text x="164" y="182" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F6F5F1">Hold</text><text x="164" y="202" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">asks what it is for</text><rect x="350" y="158" width="140" height="61" rx="8" fill="#0f0f0e" stroke="#2c2a27" stroke-width="1"/><text x="364" y="182" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F6F5F1">Stop</text><text x="364" y="202" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f8c84">ends the episode</text><line x1="300" y1="102" x2="240" y2="154" stroke="#55524b" stroke-width="1" marker-end="url(#ah)"/><text x="262.0" y="130.0" text-anchor="end" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8f8c84">middle</text><line x1="340" y1="102" x2="400" y2="154" stroke="#55524b" stroke-width="1" marker-end="url(#ah)"/><text x="378.0" y="130.0" text-anchor="start" font-family="Archivo, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8f8c84">high</text></svg>